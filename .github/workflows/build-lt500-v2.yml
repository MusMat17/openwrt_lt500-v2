name: Build LT500 v2.0-zapret-rc2 All-in-One

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0-zapret-rc2
    paths:
      - 'target/linux/ramips/**'
      - 'package/system/opkg/**'
      - 'package/kernel/linux/modules/crypto.mk'
      - 'package/kernel/linux/modules/netsupport.mk'
      - 'package/steer-core/**'
      - 'package/steer-modules/**'
      - 'package/kernel/amneziawg-lt500/**'
      - 'package/network/utils/amneziawg-tools-lt500/**'
      - 'package/luci-proto-amneziawg/**'
      - 'scripts/lt500/**'
      - 'files/etc/lt500-*'
      - 'package/zapret-manager-lt500/**'
      - 'feeds.conf.default'
      - 'LT500-V2-PORT.md'
      - '.github/workflows/build-lt500-v2.yml'

permissions:
  contents: write

concurrency:
  group: lt500-v2-zapret-rc2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check panel update and rollback before compiling
        run: python3 scripts/lt500/test-panel-updates.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl libelf-dev python3 python3-distutils \
            xz-utils zstd ca-certificates binutils

      - name: Build pinned Steer 2.0.3 for mipsel_24kc
        run: |
          rm -rf /tmp/steer /tmp/steer-ipk
          git clone https://github.com/splify2/steer.git /tmp/steer
          git -C /tmp/steer checkout 81a78be4c26f1a8369a92813fbfbf13f225382ab

          cd /tmp/steer
          STEER_ARCH=mipsel_24kc ./build.sh

          IPK="$(find "$PWD/out" -maxdepth 1 -type f -name 'steer-core-2.0.3-1_mipsel_24kc.ipk' -print -quit)"
          test -n "$IPK"
          ls -lh "$IPK"

          # build.sh leaves the exact package payload in build/pkg/mipsel_24kc.
          # Copy that tree directly instead of assuming a particular .ipk container format.
          PAYLOAD="$PWD/build/pkg/mipsel_24kc"
          test -d "$PAYLOAD/usr"
          rm -rf "$GITHUB_WORKSPACE/package/steer-core/files"
          mkdir -p "$GITHUB_WORKSPACE/package/steer-core/files"
          cp -a "$PAYLOAD"/. "$GITHUB_WORKSPACE/package/steer-core/files"/

          test -x "$GITHUB_WORKSPACE/package/steer-core/files/usr/sbin/steer"
          test -x "$GITHUB_WORKSPACE/package/steer-core/files/usr/sbin/steerd"
          test -x "$GITHUB_WORKSPACE/package/steer-core/files/etc/init.d/steer"
          for module in vless hysteria2 proxy xsteer obfs tgws; do
            MODULE_SRC="$PWD/build/pkg/mipsel_24kc-$module"
            MODULE_DST="$GITHUB_WORKSPACE/package/steer-modules/files/$module"
            test -x "$MODULE_SRC/usr/sbin/steer-$module"
            mkdir -p "$MODULE_DST"
            cp -a "$MODULE_SRC"/. "$MODULE_DST"/
          done

          echo "===== Steer payload ====="
          du -sh "$GITHUB_WORKSPACE/package/steer-core/files"
          find "$GITHUB_WORKSPACE/package/steer-core/files" -type f -maxdepth 5 | sort

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure LT500 v2.0-zapret-rc2
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_zapret=y
          CONFIG_IPV6=y
          CONFIG_PACKAGE_kmod-udptunnel4=y
          CONFIG_PACKAGE_kmod-udptunnel6=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_steer-core=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_steer-vless=y
          CONFIG_PACKAGE_steer-hysteria2=y
          CONFIG_PACKAGE_steer-proxy=y
          CONFIG_PACKAGE_steer-xsteer=y
          CONFIG_PACKAGE_steer-obfs=y
          CONFIG_PACKAGE_steer-tgws=y
          CONFIG_PACKAGE_zapret-manager-lt500=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_NUMBER="23.05.5"
          # CONFIG_VERSION_FILENAMES is not set
          CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/23.05.5"
          # These source feeds have no matching downloads.openwrt.org repositories.
          # Their selected packages still build and are included in the image.
          # CONFIG_FEED_zapret is not set
          EOF

          make defconfig

          echo "===== selected target/packages ====="
          grep -E '^CONFIG_TARGET_ramips|^CONFIG_IPV6=|^CONFIG_PACKAGE_(curl|unzip|zapret|kmod-udptunnel4|kmod-udptunnel6|kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg|steer-core|zapret-manager-lt500)=' .config

          for sym in \
            CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2 \
            CONFIG_PACKAGE_curl \
            CONFIG_PACKAGE_unzip \
            CONFIG_PACKAGE_zapret \
            CONFIG_IPV6 \
            CONFIG_PACKAGE_kmod-udptunnel4 \
            CONFIG_PACKAGE_kmod-udptunnel6 \
            CONFIG_PACKAGE_kmod-amneziawg \
            CONFIG_PACKAGE_amneziawg-tools \
            CONFIG_PACKAGE_luci-proto-amneziawg \
            CONFIG_PACKAGE_steer-core \
            CONFIG_PACKAGE_kmod-tun \
            CONFIG_PACKAGE_steer-vless \
            CONFIG_PACKAGE_steer-hysteria2 \
            CONFIG_PACKAGE_steer-proxy \
            CONFIG_PACKAGE_steer-xsteer \
            CONFIG_PACKAGE_steer-obfs \
            CONFIG_PACKAGE_steer-tgws \
            CONFIG_PACKAGE_zapret-manager-lt500
          do
            grep -q "^$sym=y" .config || { echo "Missing $sym"; exit 1; }
          done

          # Check after defconfig: hidden version options are otherwise discarded.
          for setting in \
            'CONFIG_IMAGEOPT=y' \
            'CONFIG_VERSIONOPT=y' \
            'CONFIG_VERSION_NUMBER="23.05.5"' \
            '# CONFIG_VERSION_FILENAMES is not set' \
            'CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/23.05.5"' \
            '# CONFIG_FEED_zapret is not set'
          do
            grep -Fx "$setting" .config || { echo "Incorrect runtime feed/version setting: $setting"; exit 1; }
          done

      - name: Download sources
        run: make download -j8

      - name: Verify pinned Zapret Manager patches before toolchain build
        run: make package/zapret-manager-lt500/prepare V=s

      - name: Build toolchain, kernel and verify AmneziaWG UDP tunnel prerequisites
        run: |
          # target/linux/compile assumes OpenWrt host tools and cross-toolchain
          # already exist. Build them explicitly before the kernel preflight.
          make tools/install -j"$(nproc)" V=s || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" V=s || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" V=s || make target/linux/compile -j1 V=s

          KDIR="$(find build_dir/target-mipsel_24kc_musl/linux-ramips_mt76x8 -mindepth 1 -maxdepth 1 -type d -name 'linux-[0-9]*' -print -quit)"
          test -n "$KDIR"
          echo "kernel_dir=$KDIR"

          echo "===== resolved kernel UDP tunnel prerequisites ====="
          # NET_UDP_TUNNEL selects NET_IP_TUNNEL, which selects DST_CACHE
          # and GRO_CELLS. IPv6 UDP uses CONFIG_IPV6; IPV6_TUNNEL is a
          # separate IP-in-IPv6 driver and is not required by AmneziaWG.
          for setting in \
            CONFIG_NET_UDP_TUNNEL=m \
            CONFIG_NET_IP_TUNNEL=m \
            CONFIG_DST_CACHE=y \
            CONFIG_GRO_CELLS=y \
            CONFIG_IPV6=y \
            CONFIG_TUN=m
          do
            grep -Fx "$setting" "$KDIR/.config" || {
              echo "Missing kernel prerequisite: $setting"
              echo "===== requested target and package settings ====="
              grep -E 'CONFIG_(NET_UDP_TUNNEL|NET_IP_TUNNEL|DST_CACHE|GRO_CELLS|IPV6)(=| )' \
                "$KDIR/.config.target" "$KDIR/.config.override" "$KDIR/.config.set" || true
              exit 1
            }
          done

          echo "===== UDP tunnel modules ====="
          test -s "$KDIR/drivers/net/tun.ko"
          test -s "$KDIR/net/ipv4/ip_tunnel.ko" || {
            echo "Missing IP tunnel dependency ip_tunnel.ko"
            exit 1
          }
          test -s "$KDIR/net/ipv4/udp_tunnel.ko" || {
            echo "Missing IPv4 udp_tunnel.ko"
            exit 1
          }
          test -s "$KDIR/net/ipv6/ip6_udp_tunnel.ko" || {
            echo "Missing IPv6 ip6_udp_tunnel.ko"
            exit 1
          }
          ls -lh "$KDIR/net/ipv4/ip_tunnel.ko" "$KDIR/net/ipv4/udp_tunnel.ko" "$KDIR/net/ipv6/ip6_udp_tunnel.ko"

          echo "===== symbols required by amneziawg.ko ====="
          for sym in \
            udp_tunnel_xmit_skb \
            udp_tunnel6_xmit_skb \
            udp_sock_create4 \
            udp_sock_create6 \
            setup_udp_tunnel_sock \
            udp_tunnel_sock_release \
            dst_cache_init \
            dst_cache_destroy \
            dst_cache_get_ip4 \
            dst_cache_get_ip6 \
            dst_cache_set_ip4 \
            dst_cache_set_ip6
          do
            grep -qE "[[:space:]]${sym}[[:space:]]" "$KDIR/Module.symvers" || {
              echo "Missing kernel symbol: $sym"
              exit 1
            }
            grep -E "[[:space:]]${sym}[[:space:]]" "$KDIR/Module.symvers"
          done

      - name: Build
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Verify all-in-one image
        run: |
          DIR="bin/targets/ramips/mt76x8"
          IMAGE="$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin"
          MANIFEST="$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2.manifest"

          test -s "$IMAGE"
          test -s "$MANIFEST"

          echo "===== image ====="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          SIZE="$(stat -c%s "$IMAGE")"
          MAX="$((15872 * 1024))"
          echo "image_bytes=$SIZE max_bytes=$MAX"
          [ "$SIZE" -le "$MAX" ] || { echo "Image exceeds LT500 firmware partition"; exit 1; }

          echo "===== required packages ====="
          for p in \
            curl unzip zapret \
            kmod-nft-queue kmod-nft-nat kmod-nft-offload \
            kmod-iptunnel kmod-udptunnel4 kmod-udptunnel6 \
            kmod-amneziawg amneziawg-tools luci-proto-amneziawg \
            kmod-tun steer-core steer-vless steer-hysteria2 steer-proxy steer-xsteer steer-obfs steer-tgws zapret-manager-lt500
          do
            grep -q "^$p " "$MANIFEST" || { echo "Package missing from image: $p"; exit 1; }
            grep "^$p " "$MANIFEST"
          done

          ROOT="$(find build_dir -maxdepth 3 -type d -name root-ramips -print -quit)"
          test -n "$ROOT"
          test -x "$ROOT/usr/sbin/steer"
          test -x "$ROOT/usr/bin/awg"
          test -x "$ROOT/opt/zapret/nfq/nfqws"
          test -x "$ROOT/usr/libexec/zapret-manager-installer"
          test -x "$ROOT/usr/libexec/lt500-panel-apply"
          test -x "$ROOT/usr/libexec/lt500-panel-update"
          for module in vless hysteria2 proxy xsteer obfs tgws; do
            test -x "$ROOT/usr/sbin/steer-$module"
          done
          grep -q 'proto_config_add_string "awg_i1"' "$ROOT/lib/netifd/proto/amneziawg.sh"
          grep -q 'lt500-panel-update' "$ROOT/usr/libexec/zapret-manager-installer"
          grep -qx awg2-i1-tun-steer203 "$ROOT/etc/lt500-capabilities"
          staging_dir/host/bin/fwtool -i /tmp/image-metadata.json "$IMAGE"
          python3 -c 'import json; m=json.load(open("/tmp/image-metadata.json")); assert "cudy,lt500-v2" in m["supported_devices"]; assert m["version"]["version"] == "23.05.5"'
          python3 scripts/lt500/check-module-abi.py "$ROOT"

          echo "===== runtime release and repositories ====="
          grep -Fx "DISTRIB_RELEASE='23.05.5'" "$ROOT/etc/openwrt_release"
          FEEDS="$ROOT/etc/opkg/distfeeds.conf"
          cat "$FEEDS"
          grep -Fx 'src/gz openwrt_base https://downloads.openwrt.org/releases/23.05.5/packages/mipsel_24kc/base' "$FEEDS"
          if grep -Eq '23\.05-SNAPSHOT|/packages/mipsel_24kc/(amneziawg|zapret)(/|$)' "$FEEDS"; then
            echo "Image contains unavailable runtime repositories"
            exit 1
          fi

          echo "===== target files ====="
          ls -lh "$DIR"

      - name: Prepare firmware and independent panel assets
        run: python3 scripts/lt500/release-assets.py

      - name: Upload checked RC2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cudy-lt500v2-openwrt-23.05.5-v2.0-zapret-rc2
          if-no-files-found: error
          retention-days: 30
          path: bin/targets/ramips/mt76x8/release/*

      - name: Publish RC2 and compatible panel channel
        if: github.ref == 'refs/heads/v2.0-zapret-rc2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="bin/targets/ramips/mt76x8/release"
          TAG="v2.0-zapret-rc2"
          # Preserve RC1 and refuse to overwrite an already published RC2.
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title 'Cudy LT500v2 — OpenWrt 23.05.5 — v2.0-zapret-rc2' \
            --notes-file "$DIR/INSTALL-RC2.md" --prerelease "$DIR"/*
          if ! gh release view lt500-panel-stable >/dev/null 2>&1; then
            gh release create lt500-panel-stable --target "$GITHUB_SHA" \
              --title 'Compatible LT500 panel updates' \
              --notes 'Reviewed panel-only packages for LT500 all-in-one firmware. Kernel modules are updated with firmware.' \
              --prerelease
          fi
          gh release upload lt500-panel-stable --clobber \
            "$DIR/lt500-panel.json" "$DIR"/zapret-manager-lt500_*.ipk
