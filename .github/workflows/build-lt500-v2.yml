name: Build LT500 v2 OpenWrt 23.05.5

on:
  workflow_dispatch:
  push:
    branches:
      - lt500-v2-23.05.5
    paths:
      - 'target/linux/ramips/**'
      - '.github/workflows/build-lt500-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev python3 python3-distutils \
            xz-utils zstd ca-certificates

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure LT500 v2
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_VERSION_NUMBER="23.05.5"
          CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/23.05.5"
          EOF

          make defconfig

          echo "===== selected target ====="
          grep -E '^CONFIG_TARGET_ramips|^CONFIG_PACKAGE_luci=' .config

          grep -q '^CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2=y' .config

      - name: Download sources
        run: make download -j8

      - name: Build
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Verify output
        run: |
          IMAGE="bin/targets/ramips/mt76x8/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin"
          test -s "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo "===== target files ====="
          ls -lh bin/targets/ramips/mt76x8/

      - name: Upload LT500 v2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: cudy-lt500-v2-openwrt-23.05.5
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/targets/ramips/mt76x8/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin
            bin/targets/ramips/mt76x8/profiles.json
            bin/targets/ramips/mt76x8/sha256sums
