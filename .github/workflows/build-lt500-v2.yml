name: Build LT500 v2.0-zapret-rc1 All-in-One

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0-zapret-rc1
    paths:
      - 'target/linux/ramips/**'
      - 'package/system/opkg/**'
      - 'package/kernel/linux/modules/crypto.mk'
      - 'package/steer-core/**'
      - 'package/zapret-manager-lt500/**'
      - 'feeds.conf.default'
      - 'LT500-V2-PORT.md'
      - '.github/workflows/build-lt500-v2.yml'

permissions:
  contents: write

concurrency:
  group: lt500-v2-zapret-rc1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl libelf-dev python3 python3-distutils \
            xz-utils zstd ca-certificates binutils

      - name: Build pinned Steer 2.0.3 for mipsel_24kc
        run: |
          rm -rf /tmp/steer /tmp/steer-ipk
          git clone https://github.com/splify2/steer.git /tmp/steer
          git -C /tmp/steer checkout 81a78be4c26f1a8369a92813fbfbf13f225382ab

          cd /tmp/steer
          STEER_ARCH=mipsel_24kc ./build.sh

          IPK="$(find "$PWD/out" -maxdepth 1 -type f -name 'steer-core-2.0.3-1_mipsel_24kc.ipk' -print -quit)"
          test -n "$IPK"
          ls -lh "$IPK"

          # build.sh leaves the exact package payload in build/pkg/mipsel_24kc.
          # Copy that tree directly instead of assuming a particular .ipk container format.
          PAYLOAD="$PWD/build/pkg/mipsel_24kc"
          test -d "$PAYLOAD/usr"
          rm -rf "$GITHUB_WORKSPACE/package/steer-core/files"
          mkdir -p "$GITHUB_WORKSPACE/package/steer-core/files"
          cp -a "$PAYLOAD"/. "$GITHUB_WORKSPACE/package/steer-core/files"/

          test -x "$GITHUB_WORKSPACE/package/steer-core/files/usr/sbin/steer"
          test -x "$GITHUB_WORKSPACE/package/steer-core/files/usr/sbin/steerd"
          test -x "$GITHUB_WORKSPACE/package/steer-core/files/etc/init.d/steer"

          echo "===== Steer payload ====="
          du -sh "$GITHUB_WORKSPACE/package/steer-core/files"
          find "$GITHUB_WORKSPACE/package/steer-core/files" -type f -maxdepth 5 | sort

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure LT500 v2.0-zapret-rc1
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_zapret=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_steer-core=y
          CONFIG_PACKAGE_zapret-manager-lt500=y
          CONFIG_VERSION_NUMBER="23.05.5"
          CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/23.05.5"
          EOF

          make defconfig

          echo "===== selected target/packages ====="
          grep -E '^CONFIG_TARGET_ramips|^CONFIG_PACKAGE_(curl|unzip|zapret|kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg|steer-core|zapret-manager-lt500)=' .config

          for sym in \
            CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-v2 \
            CONFIG_PACKAGE_curl \
            CONFIG_PACKAGE_unzip \
            CONFIG_PACKAGE_zapret \
            CONFIG_PACKAGE_kmod-amneziawg \
            CONFIG_PACKAGE_amneziawg-tools \
            CONFIG_PACKAGE_luci-proto-amneziawg \
            CONFIG_PACKAGE_steer-core \
            CONFIG_PACKAGE_zapret-manager-lt500
          do
            grep -q "^$sym=y" .config || { echo "Missing $sym"; exit 1; }
          done

      - name: Download sources
        run: make download -j8

      - name: Build
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Verify all-in-one image
        run: |
          DIR="bin/targets/ramips/mt76x8"
          IMAGE="$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin"
          MANIFEST="$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2.manifest"

          test -s "$IMAGE"
          test -s "$MANIFEST"

          echo "===== image ====="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          SIZE="$(stat -c%s "$IMAGE")"
          MAX="$((15872 * 1024))"
          echo "image_bytes=$SIZE max_bytes=$MAX"
          [ "$SIZE" -le "$MAX" ] || { echo "Image exceeds LT500 firmware partition"; exit 1; }

          echo "===== required packages ====="
          for p in \
            curl unzip zapret \
            kmod-nft-queue kmod-nft-nat kmod-nft-offload \
            kmod-amneziawg amneziawg-tools luci-proto-amneziawg \
            steer-core zapret-manager-lt500
          do
            grep -q "^$p " "$MANIFEST" || { echo "Package missing from image: $p"; exit 1; }
            grep "^$p " "$MANIFEST"
          done

          ROOT="$(find build_dir -maxdepth 3 -type d -name root-ramips -print -quit)"
          test -n "$ROOT"
          test -x "$ROOT/usr/sbin/steer"
          test -x "$ROOT/usr/bin/awg"
          test -x "$ROOT/opt/zapret/nfq/nfqws"
          test -x "$ROOT/usr/libexec/zapret-manager-installer"

          echo "===== target files ====="
          ls -lh "$DIR"

      - name: Prepare public RC1 release assets
        run: |
          DIR="bin/targets/ramips/mt76x8"
          SRC="$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin"
          DST="$DIR/Cudy-LT500v2-OpenWrt-23.05.5-v2.0-zapret-rc1-sysupgrade.bin"
          cp "$SRC" "$DST"
          sha256sum "$DST" > "$DIR/Cudy-LT500v2-OpenWrt-23.05.5-v2.0-zapret-rc1-SHA256.txt"

      - name: Publish Cudy LT500v2 — OpenWrt 23.05.5 — v2.0-zapret-rc1
        if: github.ref == 'refs/heads/v2.0-zapret-rc1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="bin/targets/ramips/mt76x8"
          TAG="v2.0-zapret-rc1"
          TITLE="Cudy LT500v2 — OpenWrt 23.05.5 — v2.0-zapret-rc1"

          cat > /tmp/release-notes.md <<'EOF'
          # Cudy LT500v2 — OpenWrt 23.05.5 — v2.0-zapret-rc1

          First public release candidate of the LT500v2 / R25 OpenWrt port.

          **Hardware target:** Cudy LT500v2 (R25) only.
          **Base:** OpenWrt 23.05.5 / ramips/mt76x8.
          **LTE:** Quectel EC200A, CDC-ECM (usb0), AT control on /dev/ttyUSB1.

          ## Included
          - LTE support for the EC200A via CDC-ECM
          - LuCI
          - curl and unzip
          - opkg upgrade safety guard
          - Zapret 72.20260307 built from source for this firmware
          - Zapret Manager 2.48
          - Steer Core 2.0.3
          - AmneziaWG kernel module/tools/LuCI built for this exact kernel ABI
          - WARP/AWG support through Zapret Manager + Steer

          ## Important
          This is RC1 for an unsupported device port. Use only on Cudy LT500v2 / R25.

          Installation path:
          Cudy stock firmware → official Cudy intermediary OpenWrt firmware → this sysupgrade image.

          Before flashing, run:
          sysupgrade -T /tmp/Cudy-LT500v2-OpenWrt-23.05.5-v2.0-zapret-rc1-sysupgrade.bin

          Do not force-install foreign kmod-* packages. Zapret and AmneziaWG in this build are firmware-owned and should be updated only with a matching LT500 firmware release.

          TFTP recovery remains recommended before experimenting.
          EOF

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            "$DIR/Cudy-LT500v2-OpenWrt-23.05.5-v2.0-zapret-rc1-sysupgrade.bin" \
            "$DIR/Cudy-LT500v2-OpenWrt-23.05.5-v2.0-zapret-rc1-SHA256.txt" \
            "$DIR/openwrt-ramips-mt76x8-cudy_lt500-v2.manifest" \
            "$DIR/profiles.json"
      - name: Upload LT500 v2.0-zapret-rc1 firmware
        uses: actions/upload-artifact@v4
        with:
          name: cudy-lt500v2-openwrt-23.05.5-v2.0-zapret-rc1
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/targets/ramips/mt76x8/openwrt-ramips-mt76x8-cudy_lt500-v2-squashfs-sysupgrade.bin
            bin/targets/ramips/mt76x8/openwrt-ramips-mt76x8-cudy_lt500-v2.manifest
            bin/targets/ramips/mt76x8/profiles.json
            bin/targets/ramips/mt76x8/sha256sums
