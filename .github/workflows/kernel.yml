name: Build Kernel

on:
  pull_request:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
  push:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
    branches-ignore:
      - master
      - v2.0-rc1
      - lt500-v2-23.05.5

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/v2.0-zapret-rc2' }}

jobs:
  lt500-custom-build:
    if: github.ref == 'refs/heads/v2.0-zapret-rc2'
    runs-on: ubuntu-22.04
    steps:
      - run: echo 'LT500 firmware and its packages are validated by build-lt500-v2.yml'
  build-kernels:
    if: github.ref != 'refs/heads/v2.0-zapret-rc2'
    name: Build all affected Kernels
    permissions:
      contents: read
      packages: read
      actions: write
    secrets:
      ccache_s3_endpoint: ${{ secrets.CCACHE_S3_ENDPOINT }}
      ccache_s3_bucket: ${{ secrets.CCACHE_S3_BUCKET }}
      ccache_s3_access_key: ${{ secrets.CCACHE_S3_ACCESS_KEY }}
      ccache_s3_secret_key: ${{ secrets.CCACHE_S3_SECRET_KEY }}
    uses: openwrt/actions-shared-workflows/.github/workflows/kernel.yml@main
